services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resale
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: local-resale
    volumes:
      - data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U resale -d resale"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://resale:local-resale@db:5432/resale
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - api
volumes:
  data:
